name: Verkeer bijwerken
on:
  schedule:
    # GitHub start geplande taken vaak te laat. Daarom start deze taak maar twee keer per uur
    # en blijft zelf bijna een uur draaien (zie de lus hieronder). Dubbele starts zijn niet erg:
    # door de 'concurrency' hieronder wacht een nieuwe run tot de vorige klaar is.
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verkeer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Elke 5 minuten bijwerken (ongeveer 55 minuten lang)
        run: |
          git config user.name "verkeer-bot"
          git config user.email "verkeer-bot@users.noreply.github.com"
          end=$((SECONDS+3300))
          while [ $SECONDS -lt $end ]; do
            python verkeer_updater.py --once || echo "updater mislukt, volgende ronde opnieuw"
            git add -A
            git commit -m "verkeer bijgewerkt" || echo "niets veranderd"
            git pull --rebase -q || true
            git push || echo "push mislukt, volgende ronde opnieuw"
            sleep 300
          done
