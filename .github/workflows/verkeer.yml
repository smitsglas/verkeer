name: Verkeer bijwerken
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verkeer
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verkeer_updater.py --once
      - run: |
          git config user.name "verkeer-bot"
          git config user.email "verkeer-bot@users.noreply.github.com"
          git add -A
          git commit -m "verkeer bijgewerkt" || echo "niets veranderd"
          git push
