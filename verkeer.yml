name: verkeer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verkeer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verkeer ophalen
        run: python verkeer_updater.py --once

      - name: Wijzigingen opslaan
        run: |
          git config user.name "verkeer-bot"
          git config user.email "verkeer-bot@users.noreply.github.com"
          git add verkeer.js verkeer.json ndw_diagnose.txt vild.json vild_diagnose.txt extra_diagnose.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "verkeer"
          git push
